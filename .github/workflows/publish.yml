name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish core
        run: |
          PKG=@epfl-enac/observability-core
          V=$(node -p "require('./packages/core/package.json').version")
          if npm view "$PKG@$V" version >/dev/null 2>&1; then
            echo "$PKG@$V already published — skipping"
          else
            npm publish --workspace="$PKG" --access public
          fi

      - name: Publish quasar
        run: |
          PKG=@epfl-enac/observability-quasar
          V=$(node -p "require('./packages/quasar/package.json').version")
          if npm view "$PKG@$V" version >/dev/null 2>&1; then
            echo "$PKG@$V already published — skipping"
          else
            npm publish --workspace="$PKG" --access public
          fi
